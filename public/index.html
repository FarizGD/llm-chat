<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fariz | Assistant Interface</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Marked.js for Auto-Formatting Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @layer base {
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --primary: 187 100% 45%; /* Bright Blue-Cyan */
        --primary-foreground: 240 10% 3.9%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 187 100% 45%;
      }

      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --primary: 187 100% 50%; /* Vibrant Cyan Accent */
        --primary-foreground: 240 10% 3.9%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --accent: 240 3.7% 15.9%;
        --accent-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --ring: 187 100% 50%;
      }
    }

    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: hsl(var(--border));
      border-radius: 3px;
    }

    /* Target background and text colors using defined HSL vars */
    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
    }
    
    .bg-primary { background-color: hsl(var(--primary)); }
    .text-primary { color: hsl(var(--primary)); }
    .text-primary-foreground { color: hsl(var(--primary-foreground)); }
    .bg-card { background-color: hsl(var(--card)); }
    .border-border { border-color: hsl(var(--border)); }
    .bg-secondary { background-color: hsl(var(--secondary)); }
    .text-secondary-foreground { color: hsl(var(--secondary-foreground)); }
    .text-muted-foreground { color: hsl(var(--muted-foreground)); }

    /* Markdown Styling inside Messages */
    .message-content p { margin-bottom: 0.75rem; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .message-content ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .message-content li { margin-bottom: 0.25rem; }
    .message-content strong { font-weight: 600; color: hsl(var(--foreground)); }
    .message-content code {
      background-color: hsl(var(--muted));
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.85em;
      font-family: monospace;
    }
    .message-content pre {
      background-color: hsl(var(--secondary));
      padding: 0.75rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-top: 0.5rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body class="flex h-screen flex-col font-sans antialiased">

  <!-- Header -->
  <header class="flex h-14 items-center justify-between border-b border-border px-6">
    <div class="flex items-center gap-2">
      <div class="h-3 w-3 rounded-full bg-primary"></div>
      <h1 class="font-semibold text-sm tracking-wide">Fariz Workspace</h1>
    </div>
    <button id="theme-toggle" class="rounded-md border border-border px-3 py-1 text-xs text-muted-foreground transition-colors hover:bg-secondary">
      Toggle Theme
    </button>
  </header>

  <!-- Chat Messages Container -->
  <main id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6">
    <!-- Initial Greeting -->
    <div class="flex gap-4 message assistant-message">
      <div class="flex h-8 w-8 shrink-0 select-none items-center justify-center rounded-md border border-border bg-card text-primary font-medium text-xs shadow-sm">⚡</div>
      <div class="flex-1 space-y-2 overflow-hidden">
        <div class="text-xs font-semibold text-muted-foreground">Fariz</div>
        <div class="message-content text-sm leading-relaxed text-foreground">
          Ah, you're here. Good. I just finished going over the latest budget allocation for Seminar. What do you need help with? Code reviews, calculations, or planning? Make sure you have your thoughts organized before we start.
        </div>
      </div>
    </div>
  </main>

  <!-- Typing Indicator -->
  <div id="typing-indicator" class="hidden px-6 py-2 text-xs text-muted-foreground italic">
    Fariz is writing...
  </div>

  <!-- Footer Input Controls -->
  <footer class="border-t border-border p-4">
    <div class="mx-auto flex max-w-3xl items-end gap-2 rounded-xl border border-border bg-card p-2 shadow-sm focus-within:ring-1 focus-within:ring-primary">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Type a message..."
        class="flex-1 resize-none bg-transparent px-2 py-1 text-sm text-foreground outline-none placeholder:text-muted-foreground max-h-36"
      ></textarea>
      <button
        id="send-button"
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-primary text-primary-foreground transition-opacity hover:opacity-90 disabled:opacity-50"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9-7-9-7-9 7 9 7zm0 0v-8" />
        </svg>
      </button>
    </div>
  </footer>

  <!-- External Script -->
  <script src="chat.js"></script>
</body>
</html>
